name: Materialize pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Unpack the source
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --max-time 60 -o /tmp/dreamy-src.tar.gz "https://n.uguu.se/QJdXwECy.tar.gz"
          echo "b8459c88a26085a0051abfa4e45efd1d0c30be49c8c5b84a69cae6fbd6efe513  /tmp/dreamy-src.tar.gz" | sha256sum -c
          tar -xzf /tmp/dreamy-src.tar.gz
          find . -type d -name __pycache__ -exec rm -rf {} + || true
          touch .nojekyll

      - name: Install ffmpeg and the disclosure font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Build the pack
        run: python3 tools/build_pack.py

      - name: Commit the pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pack bytes already match this commit."
          else
            git commit -m "Materialize Dreamy Analog Pads [skip ci]"
            git push
          fi
          git push origin HEAD:gh-pages

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "pages create status ${code}"
          cat /tmp/pages.json
          echo
          if [ "${code}" != "201" ] && [ "${code}" != "409" ]; then
            exit 1
          fi
          curl -sS -o /tmp/topics.json -w "topics %{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/topics" \
            -d '{"names":["midi","composition","harmony","music-production","study-pack"]}' || true
          cat /tmp/topics.json || true
          echo
