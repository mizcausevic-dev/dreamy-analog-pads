name: Materialize pack

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  duration-text:
    if: ${{ contains(github.event.head_commit.message, 'duration-text-once') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: State the catalog preview as 26.697 seconds
        run: |
          set -euo pipefail
          cat > /tmp/fix_index.py << 'PY'
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text()
          already = (
              "About 26.7" not in text
              and "26.70" not in text
              and "26.67" not in text
              and text.count("26.697") >= 3
          )
          if already:
              raise SystemExit(0)
          if text.count("About 26.7 seconds") != 1:
              raise SystemExit("about count %s" % text.count("About 26.7 seconds"))
          if text.count("26.70") != 1:
              raise SystemExit("26.70 count %s" % text.count("26.70"))
          if text.count("26.67") != 1:
              raise SystemExit("26.67 count %s" % text.count("26.67"))
          text = text.replace("About 26.7 seconds", "26.697 seconds")
          text = text.replace("26.70", "26.697")
          text = text.replace("26.67", "26.697")
          if "About 26.7" in text or "26.70" in text or "26.67" in text:
              raise SystemExit("leftover duration")
          if "\u2014" in text:
              raise SystemExit("emdash")
          if "preview, not a master" not in text:
              raise SystemExit("preview phrase missing")
          card = "72 BPM, 8 bars, D major, tonic D. 26.697 seconds at the encoded tempo."
          preview = "This MP3 is 26.697 seconds. preview, not a master. The film is 26.697 seconds and shows preview, not master."
          if card not in text or preview not in text:
              raise SystemExit("catalog sentences missing")
          path.write_text(text)
          PY
          python3 /tmp/fix_index.py
          git checkout HEAD~1 -- .github/workflows/materialize.yml
          if grep -q duration-text-once .github/workflows/materialize.yml; then
            echo "workflow was not restored"
            exit 1
          fi
          git config user.name "mizcausevic-dev"
          git config user.email "mizcausevic-dev@users.noreply.github.com"
          git add index.html .github/workflows/materialize.yml
          git commit -m "State the catalog preview as 26.697 seconds [skip ci]"
          git push origin HEAD:main
          git fetch origin gh-pages
          git checkout --detach origin/gh-pages
          python3 /tmp/fix_index.py
          git add index.html
          git diff --cached --quiet && echo "gh-pages index already correct" && exit 0
          git commit -m "State the catalog preview as 26.697 seconds [skip ci]"
          git push origin HEAD:gh-pages
